<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de establecimientos comerciales</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--mute:#667085;--line:#dde1e8;--acc:#1f5fbf;--accT:#fff;--err:#b42318;--head:#e9edf3}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--ink:#e8ebf0;--mute:#98a2b3;--line:#323946;--acc:#6ea0f0;--accT:#10151c;--err:#f97066;--head:#262c37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
[hidden]{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
#login form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px;width:100%;max-width:340px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
label{display:block;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible,th:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{padding:9px 14px;border:0;border-radius:6px;background:var(--acc);color:var(--accT);font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:wait}
#login button{width:100%;margin-top:18px}
.err{color:var(--err);min-height:20px;margin:10px 0 0}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header h2{font-size:16px;margin:0;flex:1 1 200px}
header .who{color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px}
.bar input{max-width:320px}
.bar .info{color:var(--mute);margin-left:auto}
.wrap{margin:0 16px;overflow:auto;max-height:calc(100vh - 240px);border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:max-content;min-width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
th{position:sticky;top:0;background:var(--head);cursor:pointer;user-select:none;z-index:1}
th.s::after{content:" \25B2"}th.s.d::after{content:" \25BC"}
tbody tr:hover{background:var(--head)}
.pag{display:flex;gap:10px;align-items:center;padding:12px 16px}
.pag span{color:var(--mute)}
#ld{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:color-mix(in srgb,var(--bg) 94%,transparent)}
#ld .sp{width:84px;height:84px;border:9px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:giro 1s linear infinite}
#ld h3{margin:8px 0 0;font-size:26px}
#ld p{margin:0;color:var(--mute);font-size:16px;max-width:420px}
#ld .t{font-variant-numeric:tabular-nums;color:var(--ink)}
@keyframes giro{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#ld .sp{animation-duration:3s}}
.act{display:inline-flex;align-items:center;gap:8px;color:var(--mute)}
.act i{display:none;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:giro 1s linear infinite}
.act.busy i{display:inline-block}
select{padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;max-width:230px}
select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
</style>
</head>
<body>

<section id="login">
  <form id="f">
    <h1>Acceso</h1>
    <p class="sub">Gestión de establecimientos comerciales</p>
    <label for="u">Usuario</label><input id="u" autocomplete="username" required>
    <label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required>
    <button id="bl">Entrar</button>
    <p class="err" id="le" role="alert"></p>
  </form>
</section>

<main id="app" hidden>
  <header>
    <h2>Establecimientos comerciales</h2>
    <span class="who" id="who"></span>
    <button class="sec" id="out">Salir</button>
  </header>
  <div class="bar">
    <select id="fm" aria-label="Municipio"></select>
    <select id="fl" aria-label="Localidad"></select>
    <select id="fr" aria-label="Revisados"></select>
    <button class="sec" id="lf">Limpiar filtros</button>
    <input id="q" type="search" placeholder="Buscar en todos los campos" aria-label="Buscar">
    <span class="act" id="act" hidden role="status"><i></i><span id="actt"></span><button class="sec" id="rf" hidden>Actualizar ahora</button></span>
    <span class="info" id="info"></span>
  </div>
  <div class="wrap"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
  <div class="pag">
    <button class="sec" id="pv">Anterior</button><span id="pg"></span><button class="sec" id="nx">Siguiente</button>
  </div>
</main>

<div id="ld" role="status" aria-live="polite" hidden>
  <div class="sp"></div>
  <h3>Cargando datos…</h3>
  <p id="ldm"></p>
  <p class="t" id="ldt"></p>
  <button class="sec" id="cl" hidden>Cancelar y volver al acceso</button>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbywcJXtUPfuBJbbPzNYOqz10G4tyFGvHKN-PrENIPYy8R8amdFb_bOdnlwMeSXwZjGA/exec';
const PAGE = 50;
// Columnas que se reciben (para uso interno) pero no se muestran en la tabla
const OCULTAS = ['id','nre','ot','ncn','est','idprovincia','idmunicipio','idlocalidad','habitantes','idsc','codiae','codcnae','grupodeaccionlocal'];
// Un registro cuenta como "revisado" si su fecha de alta, modificación o baja es posterior a esta fecha
const FECHA_REVISION = new Date(2026, 6, 1);   // 01/07/2026
const COL_FECHAS = ['fechaalta', 'fechamodi', 'fechabaja'];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const clave = s => fold(s).replace(/[^a-z0-9]/g, '');
let iMun = -1, iLoc = -1, head = [], vis = [], all = [], view = [], page = 0, sortCol = -1, sortDesc = false, info = {}, gen = 0, ldTimer;

const espera = ms => new Promise(r => setTimeout(r, ms));
// Petición con reintentos automáticos (Apps Script falla a veces en el primer intento)
async function api(body, intentos = 3, ms = 40000) {
  for (let n = 1; ; n++) {
    const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
    try {
      const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), signal: ac.signal });
      return await r.json();
    } catch (e) { if (n >= intentos) throw e; await espera(1500 * n); }
    finally { clearTimeout(t); }
  }
}

function showLogin(msg) {
  gen++; showLoad(false); setAct('');
  localStorage.removeItem('tk'); localStorage.removeItem('usr');
  $('app').hidden = true; $('login').hidden = false; $('le').textContent = msg || ''; $('bl').disabled = false;
}

$('f').onsubmit = async e => {
  e.preventDefault(); $('bl').disabled = true; $('le').textContent = '';
  try {
    const r = await api({ action: 'login', usuario: $('u').value, password: $('p').value });
    if (!r.ok) return showLogin(r.error);
    localStorage.setItem('tk', r.token);
    localStorage.setItem('usr', JSON.stringify({ u: r.usuario, p: r.provincia }));
    $('p').value = ''; load();
  } catch (x) { showLogin('No se pudo conectar con el servidor. Inténtalo de nuevo.'); }
};
$('out').onclick = $('cl').onclick = () => showLogin();
$('rf').onclick = () => refrescar(localStorage.getItem('tk'), gen);

function showLoad(on, msg) {
  clearInterval(ldTimer); $('ld').hidden = !on;
  if (!on) return;
  $('ldm').textContent = msg || '';
  $('cl').hidden = true;
  const t0 = Date.now(), tick = () => {
    const n = Math.floor((Date.now() - t0) / 1000);
    $('ldt').textContent = 'Transcurridos ' + n + ' s'; $('cl').hidden = n < 10;
  };
  tick(); ldTimer = setInterval(tick, 1000);
}
function setAct(txt, busy) {
  $('act').hidden = !txt; $('actt').textContent = txt || ''; $('rf').hidden = !!busy; $('act').classList.toggle('busy', !!busy);
}
const seg = t0 => ((performance.now() - t0) / 1000).toFixed(1);
const caducada = () => showLogin('La sesión ha caducado. Vuelve a entrar.');

async function load() {
  const tk = localStorage.getItem('tk'); if (!tk) return showLogin();
  const usr = JSON.parse(localStorage.getItem('usr') || '{}'), id = ++gen, t0 = performance.now();
  $('login').hidden = true; $('app').hidden = false;
  $('who').textContent = usr.u + ' · ' + usr.p;
  $('tb').innerHTML = ''; $('th').innerHTML = ''; $('info').textContent = ''; setAct('');
  showLoad(true, 'Puede tardar unos segundos.');

  // 1) Carga rápida desde el archivo diario
  let r = null;
  try { r = await api({ action: 'list', token: tk, fuente: 'json' }, 2, 25000); } catch (e) {}
  if (id !== gen) return;
  if (r && r.expired) return caducada();
  if (r && r.ok && !r.vacio) {
    setData(r, false, seg(t0)); showLoad(false);
    if (r.vigente) return setAct('Datos al día (generados ' + r.gen + ')');
    return refrescar(tk, id);          // 2) y actualiza en segundo plano con la hoja real
  }

  // Si todavía no existe el archivo, carga directa desde la hoja
  showLoad(true, 'Este proceso puede tardar entre 20 y 30 segundos. No cierres ni recargues la página.');
  try {
    r = await api({ action: 'list', token: tk, fuente: 'hoja' }, 2, 150000);
    if (id !== gen) return;
    if (r.expired) return caducada();
    if (!r.ok) return showLogin(r.error);
    setData(r, false, seg(t0));
  } catch (e) { $('info').textContent = 'No se pudo cargar. Recarga la página.'; }
  finally { if (id === gen) showLoad(false); }
}

async function refrescar(tk, id) {
  const t0 = performance.now(); setAct('Actualizando datos…', true);
  try {
    const r = await api({ action: 'list', token: tk, fuente: 'hoja' }, 1, 150000);
    if (id !== gen) return;
    if (r.expired) return caducada();
    if (!r.ok) throw new Error(r.error);
    setData(r, true, info.primera);
    setAct('Actualizado a las ' + new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }) + ' (' + seg(t0) + ' s)');
  } catch (e) {
    if (id === gen) setAct('No se pudo actualizar. Datos del archivo diario ' + (info.gen || ''));
  }
}

function setData(r, keep, primera) {
  head = r.head; all = r.rows;
  vis = head.map((h, i) => i).filter(i => !OCULTAS.includes(clave(head[i])));
  all.forEach(row => { row.h = fold(vis.map(i => row[i]).join(' ')); });
  info = { fuente: r.fuente, gen: r.gen, primera };
  iMun = head.findIndex(h => clave(h) === 'municipio');
  iLoc = head.findIndex(h => clave(h) === 'localidad');
  const iF = COL_FECHAS.map(c => head.findIndex(h => clave(h) === c)).filter(i => i >= 0);
  let nRev = 0;
  all.forEach(row => {
    row.rev = iF.some(i => { const d = parseFecha(row[i]); return d && d > FECHA_REVISION; });
    if (row.rev) nRev++;
  });
  if (!keep) {
    sortCol = -1; sortDesc = false; page = 0; $('q').value = '';
    $('fm').value = ''; $('fl').value = ''; $('fr').value = '';
  }
  const m = $('fm').value, l = $('fl').value, v = $('fr').value;
  rellenar($('fm'), valores(iMun), 'Todos los municipios', m);
  rellenarLoc(l);
  $('fr').innerHTML = `<option value="">Revisados: todos</option><option value="si">Revisados (${nRev.toLocaleString('es')})</option><option value="no">Sin revisar (${(all.length - nRev).toLocaleString('es')})</option>`;
  $('fr').value = v;
  buildHead(); filter(true);
}

function parseFecha(s) {
  const t = String(s).trim();
  let m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
const ord = (a, b) => a.localeCompare(b, 'es', { sensitivity: 'base', numeric: true });
function valores(i, mun) {
  const set = new Set();
  all.forEach(r => { if (r[i] !== '' && (!mun || r[iMun] === mun)) set.add(r[i]); });
  return [...set].sort(ord);
}
function rellenar(sel, vals, ph, actual) {
  sel.innerHTML = `<option value="">${ph}</option>` + vals.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  sel.value = vals.includes(actual) ? actual : '';
}
function rellenarLoc(actual) { rellenar($('fl'), valores(iLoc, $('fm').value), 'Todas las localidades', actual); }

function buildHead() {
  $('th').innerHTML = '<tr>' + vis.map(i => `<th tabindex="0" data-i="${i}">${esc(head[i])}</th>`).join('') + '</tr>';
  $('th').querySelectorAll('th').forEach(t => {
    const go = () => sortBy(+t.dataset.i);
    t.onclick = go; t.onkeydown = e => { if (e.key === 'Enter') go(); };
  });
}

function filter(keep) {
  const q = fold($('q').value.trim());
  const m = $('fm').value, l = $('fl').value, v = $('fr').value;
  view = all.filter(r => (!m || r[iMun] === m) && (!l || r[iLoc] === l) &&
    (v === '' || (v === 'si') === r.rev) && (!q || r.h.includes(q)));
  if (sortCol >= 0) doSort();
  if (keep !== true) page = 0;
  render();
}
function sortBy(i) {
  sortDesc = sortCol === i ? !sortDesc : false; sortCol = i;
  doSort(); page = 0; render();
}
function doSort() {
  const i = sortCol, d = sortDesc ? -1 : 1;
  view.sort((a, b) => d * String(a[i]).localeCompare(String(b[i]), 'es', { sensitivity: 'base', numeric: true }));
}

function render() {
  const pages = Math.max(1, Math.ceil(view.length / PAGE));
  page = Math.min(page, pages - 1);
  $('tb').innerHTML = view.slice(page * PAGE, page * PAGE + PAGE)
    .map(r => '<tr>' + vis.map(i => `<td title="${esc(r[i])}">${esc(r[i])}</td>`).join('') + '</tr>').join('');
  $('th').querySelectorAll('th').forEach(t => {
    const on = +t.dataset.i === sortCol; t.classList.toggle('s', on); t.classList.toggle('d', on && sortDesc);
  });
  $('pg').textContent = `Página ${page + 1} de ${pages}`;
  $('pv').disabled = page === 0; $('nx').disabled = page >= pages - 1;
  $('info').textContent = `${view.length.toLocaleString('es')} registros · primera carga ${info.primera} s · ` +
    (info.fuente === 'json' ? `archivo diario (${info.gen})` : 'datos en directo de la hoja');
}

$('q').oninput = $('fl').onchange = $('fr').onchange = filter;
$('fm').onchange = () => { rellenarLoc(''); filter(); };
$('lf').onclick = () => { $('q').value = ''; $('fm').value = ''; $('fr').value = ''; rellenarLoc(''); filter(); };
$('pv').onclick = () => { page--; render(); };
$('nx').onclick = () => { page++; render(); };

if (localStorage.getItem('tk')) load();
</script>
</body>
</html>
