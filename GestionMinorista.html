<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión BDD Minorista · Castilla y León</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14302b;--mut:#5d7570;--pine:#0f766e;--card:#fff;--line:#dbe4e2}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:16px/1.5 Manrope,system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1100px 550px at 15% -10%,#d6efeb 0,transparent 60%),radial-gradient(900px 480px at 100% 110%,#f6e6c8 0,transparent 55%),#eef2f1;
  display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:var(--card);border-radius:22px;box-shadow:0 10px 30px rgba(20,48,43,.10);padding:44px 40px;max-width:480px;text-align:center}
.ico{width:78px;height:78px;margin:0 auto 18px}
h1{margin:0 0 10px;font-size:24px;font-weight:800}
p{margin:0 0 26px;color:var(--mut);font-size:15.5px}
a.btn{display:inline-flex;align-items:center;gap:8px;background:var(--pine);color:#fff;text-decoration:none;font-weight:600;padding:11px 20px;border-radius:12px}
a.btn:hover{filter:brightness(1.08)}
a.btn svg{width:16px;height:16px}
</style>
</head>
<body>
<div class="box">
  <svg class="ico" viewBox="0 0 80 80" role="img" aria-label="Icono de gestión de base de datos">
    <defs><linearGradient id="d1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82a6"/><stop offset="1" stop-color="#2c6482"/></linearGradient></defs>
    <ellipse cx="40" cy="20" rx="26" ry="9" fill="url(#d1)"/>
    <path d="M14 20v18c0 5 12 9 26 9s26-4 26-9V20" fill="none" stroke="#2c6482" stroke-width="0"/>
    <path d="M14 20v18c0 5 12 9 26 9s26-4 26-9V20" fill="#7fb0c0"/>
    <ellipse cx="40" cy="38" rx="26" ry="9" fill="url(#d1)"/>
    <path d="M14 38v18c0 5 12 9 26 9s26-4 26-9V38" fill="#7fb0c0"/>
    <ellipse cx="40" cy="56" rx="26" ry="9" fill="url(#d1)"/>
    <path d="M32 66l5 5 10-11" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(0,-2)"/>
  </svg>
  <h1>Gestión de la Base de Datos Minorista</h1>
  <p>Estamos trabajando en el proyecto. Muy pronto podrás gestionar aquí los datos del comercio minorista de Castilla y León.</p>
  <a class="btn" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Volver al inicio</a>
</div>
</body>
</html>
