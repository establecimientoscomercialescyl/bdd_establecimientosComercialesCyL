<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión BDD Minorista · Castilla y León</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14302b;--mut:#5d7570;--card:#fff;--line:#dbe4e2;--pine:#0f766e;--ochre:#d08a1f;--brick:#b4432f;--bg2:#f3f6f5}
*{box-sizing:border-box}
body{margin:0;background:#eef2f1;color:var(--ink);font:14px/1.45 Manrope,system-ui,sans-serif}
header{background:linear-gradient(120deg,#0b3d38,#0f766e);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:19px;font-weight:800}
header .who{font-size:12.5px;opacity:.85}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
header .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
main{padding:20px 24px 40px;max-width:1400px;margin:auto}

/* ---- login ---- */
#login-screen{min-height:70vh;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--card);border-radius:18px;box-shadow:0 10px 30px rgba(20,48,43,.10);padding:36px 34px;width:100%;max-width:360px}
.login-box h2{margin:0 0 4px;font-size:20px;font-weight:800}
.login-box p{margin:0 0 20px;color:var(--mut);font-size:13px}
.login-box label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:14px 0 5px}
.login-box input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit}
.login-box button{width:100%;margin-top:20px;background:var(--pine);color:#fff;border:none;border-radius:10px;padding:11px;font:inherit;font-weight:700;cursor:pointer}
.login-box button:hover{filter:brightness(1.08)}
#login-err{color:var(--brick);font-size:12.5px;margin-top:10px;min-height:16px}

/* ---- filtros y tabla ---- */
#app-screen[hidden],#login-screen[hidden]{display:none}
.filters{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.filters select,.filters input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;background:#fff;min-width:170px}
.filters .count{margin-left:auto;color:var(--mut);font-size:12.5px}
.table-card{background:var(--card);border-radius:14px;overflow:hidden}
.table-scroll{overflow:auto;max-height:64vh}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
th{position:sticky;top:0;background:var(--bg2);cursor:pointer;user-select:none;font-weight:700;color:var(--ink)}
th:hover{background:#e6ede9}
th.ro,td.ro{background:#f5f2ea;color:var(--mut)}
th .arrow{opacity:.5;font-size:11px;margin-left:3px}
th.sorted .arrow{opacity:1;color:var(--pine)}
tbody tr:hover td{background:#f6faf9}
.pager{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:10px 16px;color:var(--mut);font-size:12.5px}
.pager button{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.pager button:disabled{opacity:.4;cursor:default}
.empty{padding:40px;text-align:center;color:var(--mut)}
.badge{display:inline-block;background:rgba(255,255,255,.16);border-radius:99px;padding:3px 10px;font-size:11.5px}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h2>Gestión BDD Minorista</h2>
    <p>Introduce tu usuario y contraseña para acceder a los datos de tu provincia.</p>
    <label for="li-user">Usuario</label>
    <input id="li-user" type="text" autocomplete="username">
    <label for="li-pass">Contraseña</label>
    <input id="li-pass" type="password" autocomplete="current-password">
    <button id="li-btn">Entrar</button>
    <div id="login-err"></div>
  </div>
</div>

<div id="app-screen" hidden>
  <header>
    <h1>Gestión BDD Minorista</h1>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="who" id="who"></span>
      <a class="btn" href="index.html">← Inicio</a>
      <button class="btn" id="logout-btn">Cerrar sesión</button>
    </div>
  </header>
  <main>
    <div class="filters">
      <select id="f-mun"><option value="">Todos los municipios</option></select>
      <select id="f-sec"><option value="">Todos los sectores</option></select>
      <span class="count" id="count"></span>
    </div>
    <div class="table-card">
      <div class="table-scroll"><table id="tbl"></table></div>
      <div class="pager"><span id="pinfo"></span><button id="prev">Anterior</button><button id="next">Siguiente</button></div>
    </div>
  </main>
</div>

<script>
// ====== URL de la Web App de Apps Script (ApiGestionMinorista.gs) ======
const API_URL = 'https://script.google.com/macros/s/AKfycbzk91HU5laBM8D6pGW73meFpGs3mvHQFV5uHjhdcdpACSq8jlPUiQV-BsuxOgVkpzeE/exec';
// =========================================================================
const TOKEN_KEY = 'gestion_minorista_token';
const $=id=>document.getElementById(id);
const nq=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PS = 40;

// Columnas que los usuarios de provincia no podrán editar (se rellenan
// solas). De momento solo se usa para pintarlas en gris: la edición
// llega en la fase 2.
const NO_EDITABLES = ['ID','NRE','OT','N.C.N.','EST','NRA','ID_PROVINCIA','ID_MUNICIPIO','ID_LOCALIDAD',
  'HABITANTES','ID_SC','COD_IAE','COD_CNAE','GRUPO DE ACCIÓN LOCAL','NTOTALCOMERCIO','CATEGORIA-HABITA',
  'HABITANTES_SIN_DUPLICAR'].map(nq);

let COLS=[], ROWS=[], VIEW=[], PAGE=0, SORT={col:-1, dir:1};
let iMun=-1, iSec=-1;

async function api(payload){
  const r = await fetch(API_URL, { method:'POST', body: JSON.stringify(payload) });
  const j = await r.json();
  if(j.error) throw new Error(j.error);
  return j;
}

async function doLogin(){
  $('login-err').textContent='';
  const usuario=$('li-user').value.trim(), password=$('li-pass').value;
  if(!usuario || !password){ $('login-err').textContent='Escribe usuario y contraseña.'; return; }
  $('li-btn').disabled=true; $('li-btn').textContent='Entrando…';
  try{
    const j = await api({action:'login', usuario, password});
    localStorage.setItem(TOKEN_KEY, JSON.stringify(j));
    await start(j);
  }catch(e){
    $('login-err').textContent = e.message;
  }finally{
    $('li-btn').disabled=false; $('li-btn').textContent='Entrar';
  }
}
$('li-btn').onclick=doLogin;
$('li-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

function logout(){
  localStorage.removeItem(TOKEN_KEY);
  $('app-screen').hidden=true; $('login-screen').hidden=false;
  $('li-user').value=''; $('li-pass').value=''; $('login-err').textContent='';
}
$('logout-btn').onclick=logout;

async function start(sesion){
  $('who').textContent = sesion.usuario + ' · ' + (sesion.esAdmin ? 'todas las provincias' : sesion.provincia);
  $('login-screen').hidden=true; $('app-screen').hidden=false;
  try{
    const data = await api({action:'listar', token: sesion.token});
    COLS = data.columnas; ROWS = data.filas;
    iMun = COLS.map(nq).indexOf('MUNICIPIO');
    iSec = COLS.map(nq).indexOf('SECTOR COMERCIAL');
    fillFilter('f-mun', iMun); fillFilter('f-sec', iSec);
    render();
  }catch(e){
    if(/sesión caducada/i.test(e.message)){ logout(); $('login-err').textContent='Tu sesión caducó, vuelve a entrar.'; }
    else alert('No se pudieron cargar los datos: '+e.message);
  }
}

function fillFilter(id, colIdx){
  const sel=$(id); if(colIdx<0){ sel.style.display='none'; return; }
  const vals=[...new Set(ROWS.map(r=>r[colIdx]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'es'));
  sel.innerHTML = sel.querySelector('option').outerHTML + vals.map(v=>`<option>${esc(v)}</option>`).join('');
}
$('f-mun').onchange=()=>{PAGE=0;render();};
$('f-sec').onchange=()=>{PAGE=0;render();};

function applyFilters(){
  const mun=$('f-mun').value, sec=$('f-sec').value;
  VIEW = ROWS.filter(r => (!mun || r[iMun]===mun) && (!sec || r[iSec]===sec));
  if(SORT.col>=0){
    VIEW = VIEW.slice().sort((a,b)=>{
      const x=a[SORT.col], y=b[SORT.col];
      const nx=parseFloat(x), ny=parseFloat(y);
      let c;
      if(!isNaN(nx) && !isNaN(ny) && x!=='' && y!=='') c = nx-ny;
      else c = String(x??'').localeCompare(String(y??''),'es',{numeric:true,sensitivity:'base'});
      return c*SORT.dir;
    });
  }
}

function render(){
  applyFilters();
  $('count').textContent = VIEW.length.toLocaleString('es-ES') + ' de ' + ROWS.length.toLocaleString('es-ES') + ' registros';
  const thead = '<thead><tr>' + COLS.map((c,i)=>{
    const ro = NO_EDITABLES.includes(nq(c));
    const sorted = SORT.col===i;
    const arrow = sorted ? (SORT.dir===1?'▲':'▼') : '↕';
    return `<th class="${ro?'ro':''}${sorted?' sorted':''}" data-i="${i}">${esc(c)}<span class="arrow">${arrow}</span></th>`;
  }).join('') + '</tr></thead>';

  const pages = Math.max(1, Math.ceil(VIEW.length/PS));
  PAGE = Math.min(PAGE, pages-1);
  const slice = VIEW.slice(PAGE*PS, PAGE*PS+PS);
  const tbody = '<tbody>' + (slice.map(r => '<tr>' + r.map((v,i)=>{
    const ro = NO_EDITABLES.includes(nq(COLS[i]));
    return `<td class="${ro?'ro':''}">${esc(v)}</td>`;
  }).join('') + '</tr>').join('') || `<tr><td colspan="${COLS.length||1}" class="empty">Ningún registro coincide con los filtros.</td></tr>`) + '</tbody>';

  $('tbl').innerHTML = thead + tbody;
  $('tbl').querySelectorAll('th').forEach(th => th.onclick = () => {
    const i = +th.dataset.i;
    SORT = SORT.col===i ? {col:i, dir:-SORT.dir} : {col:i, dir:1};
    render();
  });
  $('pinfo').textContent = VIEW.length ? `${PAGE*PS+1}–${Math.min(VIEW.length,PAGE*PS+PS)} de ${VIEW.length}` : '';
  $('prev').disabled = PAGE===0; $('next').disabled = PAGE>=pages-1;
}
$('prev').onclick=()=>{PAGE--;render();};
$('next').onclick=()=>{PAGE++;render();};

// ---- al cargar: si hay sesión guardada, entra directo ----
(function init(){
  const saved = localStorage.getItem(TOKEN_KEY);
  if(saved){ try{ start(JSON.parse(saved)); return; }catch(e){} }
})();
</script>
</body>
</html>
